<VirtualHost *:80>
    ServerName app.paperbell.id
    DocumentRoot /var/www/html/paperbell

    <Directory /var/www/html/paperbell>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/paperbell-error.log
    CustomLog ${APACHE_LOG_DIR}/paperbell-access.log combined
</VirtualHost>
