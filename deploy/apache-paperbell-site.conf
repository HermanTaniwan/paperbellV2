<VirtualHost *:80>
    ServerName app.paperbell.id
    DocumentRoot /var/www/html/paperbell

    <Directory /var/www/html/paperbell>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/paperbell-local-ca\.crt$
    RewriteRule ^ https://app.paperbell.id%{REQUEST_URI} [R=302,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/paperbell-error.log
    CustomLog ${APACHE_LOG_DIR}/paperbell-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName app.paperbell.id
    DocumentRoot /var/www/html/paperbell

    SSLEngine on
    SSLCertificateFile /etc/paperbell/tls/app.paperbell.id.crt
    SSLCertificateKeyFile /etc/paperbell/tls/app.paperbell.id.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <Directory /var/www/html/paperbell>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/paperbell-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/paperbell-ssl-access.log combined
</VirtualHost>
