[client]
port=3307

[mysqld]
port=3307
bind-address=127.0.0.1
basedir=C:/xampp/mysql
datadir=C:/xampp/htdocs/paperbell/storage/mysql-data
tmpdir=C:/xampp/tmp
pid-file=paperbell-mysql.pid
log-error=C:/xampp/htdocs/paperbell/storage/paperbell-mysql.log
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
skip-name-resolve
max_allowed_packet=64M
innodb_buffer_pool_size=64M
plugin-dir=C:/xampp/mysql/lib/plugin
